# cadence-standard preset (v4.5, LEAN): pacing + safety.
#
# What remains: anchor first turn (0 tools + the only cap), monotonic
# classification with F1 inbox-insert pre-classification (the FIRST task
# request carries the complex persona + complex core), narrow first-task
# surface (promoteOn=tool-call), resident catalog after promotion (core work
# tools + vision + todo_write + SAFETY VALVES + preset tools; heavier tools
# found via tool_search unlock on first use), compaction epoch (R2),
# bootstrap context strip + one-time instruction hint (R3), process-self
# guard on tools/pre-execute deny (R4), final-check boundary fix (F4: the
# in-flight step counts), verification texts require the artifact's REAL
# form (F7), per-message guides (relaxed), metacognition checkpoints
# (reflection + final check), block-length convergence steer (p50 ≥ 2500),
# safety trio precise (deadlock ladder L1–L4, process-self guard, subagent
# timeout), in-preset hot code reloader (cadence_reload), trace_status +
# tool_search (read-only).
#
# History (kept brief): V4.0 de-fit removed budget bands/Flash anchors/
# trajectory/env-stuck/score-deliver/delegation/todo sync/utilization/
# guide-frequency/trace_style/platform/file-discipline. V4.1 added the
# resident catalog + compaction epoch + strip/hint + pre-execute guard.
# V4.2 added F1 (first-request class fix) + request_tool + frequent tier.
# V4.3 REMOVED request_tool + frequent tier (measured: zero calls — a tool
# not on the surface is never used) and made vision resident; fixed the
# finalCheckDue boundary (V4.2 session: 8 steps after final write, no
# acceptance). V4.4: todo_write resident (Mona 12/14 used it, V4.1–V4.3 had
# 0 uses with unplanned iteration); real-form verification wording; a
# windowed block-length trigger was calibrated and REJECTED (mis-triggers
# the good V4.1 session). A failure-turn detector was drafted and REMOVED
# as over-specialized (zero real triggers, overlaps the deadlock ladder).
# V4.5: means-cost steer + unconverged-means backstop (session-19: ~100 min
# burned on 10 acceptance runs of the SAME means, different failure each
# round — invisible to the identical-command/failure ladder); tool_search
# token-AND matching (whole-string `includes` never matched "vision image" —
# session-19 vision discoverability loss).
#
# Deployment: config values are re-read per session JOIN (no restart for
# value changes). CODE (.mjs) is imported ONCE per process (ES module
# cache); hot reload WITHOUT restart: run `cadence_reload` in any session
# (verify-first temp-copy graph check → purge Node's ESM cache → bump the
# stamp below) — the NEXT NEW session mounts the new code. `dev_reload_*`
# cannot target preset rows (they are not injector packages).
# Design rules: no task-domain words; thresholds calibrated across task
# families; no model branches; no tool-family-specialized steers; safety
# texts stay precise; tool-surface filtering is conditioning, never a
# security control.

# ── bootstrap (must stay FIRST) ─────────────────────────────────────────────
# Owns the anchor turn, tool-surface phases, guides, checkpoints, safety
# sentinels and diagnostics. Pre-step/request listeners register with
# `prepend: true`; the pre-step listener resolves the agent via `ctx.get`
# because the `agent/pre-step` payload carries no agent field.
- id: cadence-bootstrap
  name: ./cadence-bootstrap.mjs
  config:
    # V2.2 — one 0-tool warm-up turn before the real task.
    anchorFirstTurn: true
    anchorText: Cadence 热身：本轮不执行任务、不调用任何工具。请用一两句话确认你已就绪，并简述你接下来会如何处理下一条消息。不要思考、不要规划、不要使用工具。
    # V4.0 — the ONLY remaining cap: the warm-up request.
    anchorCapMaxTokens: 2048
    # V4.0 — tool-call only: the warm-up reply does NOT promote.
    promoteOn: tool-call
    # V2.4 — metacognition checkpoints, once per session each.
    reflectionAdvisor: true
    reflectionAfterSteps: 12
    finalCheckAdvisor: true
    finalCheckAfterSteps: 8
    # V4.5 — means-level cost/unconverged detection (session-19 calibration):
    # a MEANS = platform command + first script path; interleaved writes do
    # NOT reset it (a debugging loop is not progress), and cumulative
    # wall-time is required so quick retries (downloads/fast scripts) never
    # fire. Soft layer (3 runs / 5 min, complex) reminds to re-evaluate the
    # means; hard backstop (5 runs / 15 min, any task) demands re-evaluation
    # of the means itself. Calibrated on 6 sessions: 19 fires at run 5
    # (~50 min saved); 05/06/16/17/18 silent.
    meansCostAdvisor: true
    meansCostRuns: 3
    meansCostMinSec: 300
    unconvergedDetector: true
    unconvergedRuns: 5
    unconvergedMinSec: 900
    # V2 — verified deadlock ladder (SAFETY, precise): suspicion (L1) →
    # verified (L2) → pause-and-ask (L3) → reminder (L3b) → optional L4
    # (plan-mode-safe cancel WITHOUT directive).
    deadlockDetector: true
    escalateAfterIgnore: false
    maxRepeats: 4
    maxIdenticalFailures: 3
    graceStepsAfterSteer: 2
    # V3.1 — process-self guard (SAFETY, precise): shell commands killing/
    # restarting the harness process (own PID, parent, or name-wide node kill)
    # are vetoed at tools/execute until a real user message confirms.
    processSelfGuard: true
    # V2.2 — security: remind when a delegated subagent runs too long.
    subagentTimeoutMin: 15
    # V4.0 — block-length convergence steer (once per session): running
    # reasoning-block median crossing blockP50Threshold gets one "converge"
    # nudge (calibrated on 11 sessions: only the worst crosses 2500).
    blockLengthSteer: true
    blockP50Threshold: 2500
    blockLengthAfterSteps: 10
    # V4.1 (R1) — resident catalog (conditioning, NOT a security boundary):
    # core work tools + vision + todo_write + SAFETY VALVES + preset tools,
    # plus whatever the model used beyond it (durable-derived). Heavier tools
    # are found via tool_search and unlock on first use. V4.3: vision is
    # resident (V4.1/V4.2 sessions wanted it but unlock-on-first-use is a
    # dead loop for fresh sessions); request_tool + frequent tier REMOVED
    # (measured: zero calls — a tool not on the surface is never used).
    # V4.4: todo_write joins resident (task-list carrier; Mona 12/14 used
    # it during planned work, V4.1–V4.3 had 0 uses with unplanned iteration).
    residentTools: [read, write, edit, glob, grep, pwsh, bash, vision, todo_write, subagent, subagent_fork, ask_user_question, list_agents, interrupt_agent, send_message, trace_status, cadence_reload, tool_search]
    # V4.1 (R3) — bootstrap-phase context strip (never user/policy messages).
    suppressedContextSources: [agent-instructions, skill-catalog]
    # V4.1 (R3) — one static instruction hint after promotion (replaces the
    # AGENTS.md/CLAUDE.md digest row, which is REMOVED from this composition).
    instructionHint: true

# ── code reloader (V3.0, custom) ────────────────────────────────────────────
# In-preset hot reload WITHOUT restart: `cadence_reload` verifies the .mjs
# files from a throwaway temp copy (full graph), purges the real URLs from
# Node's ESM cache, then bumps the stamp below — the roster's generation
# stamp is this file's {mtimeMs,size}, so the NEXT NEW session mounts the
# new code. Existing sessions keep their generation.
- id: cadence-reloader
  name: ./cadence-reloader.mjs
  config: {}

# ── identity ────────────────────────────────────────────────────────────────

# Fallback persona only: the cadence plugin replaces the persona section at
# every prompt assembly with the complexity-matched text, so this row never
# reaches the model unless the plugin is absent.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful assistant.

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    # Prune oversized tool results so retained context stays dense; the
    # cadence sentinels then see tool results worth acting on.
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 12288
        headChars: 6144
        tailChars: 2048

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 32

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 45000

