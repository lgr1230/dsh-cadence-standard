name: Cadence Standard (experimental)
description: Thinking-budget pacing v4.4 (LEAN + resident catalog) — anchor first turn (0-tool warm-up + the only remaining cap), monotonic classification with inbox-insert pre-classification (the FIRST task request carries the complex persona + complex core), narrow first-task tool surface (promoteOn=tool-call), resident catalog after promotion (core work tools + vision + todo_write + SAFETY VALVES + preset tools; heavier tools found via tool_search unlock on first use — conditioning only), compaction epoch, bootstrap context strip + one-time instruction hint, process-self guard on tools/pre-execute deny, final-check boundary fix (in-flight step counts), verification texts require the artifact's REAL form, per-message guides (relaxed), metacognition checkpoints (reflection + final check), block-length convergence steer (p50 ≥ 2500), safety trio kept precise (deadlock ladder L1–L4, process-self guard, subagent timeout), in-preset hot code reloader, trace_status + tool_search read-only diagnostics. Design rules: no task-domain words; thresholds calibrated across task families; no model branches; no tool-family-specialized steers; safety texts stay precise; tool-surface filtering is conditioning, never a security control.
order: 6
